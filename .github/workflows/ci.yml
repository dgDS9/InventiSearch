name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/dgds9/inventisearch-backend

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall backend

      - name: Run tests
        working-directory: backend
        env:
          GEMINI_API_KEY: test-key
        run: |
          pip install pytest
          python -m pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend-checks

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy-development:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment configuration
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/deploy/inventisearch"

          scp -i ~/.ssh/deploy_key \
            compose.deploy.yaml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/inventisearch/compose.deploy.yaml

      - name: Deploy Development
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          set -e

          export DEPLOY_ENV=development
          export HOST_PORT=8001
          export IMAGE_TAG=${{ github.sha }}

          export APP_ENV_FILE=/opt/InventiSearch/backend/.env
          export CHROMA_PATH=/opt/InventiSearch/environments/development/chroma_db
          export PROCESSED_FILE=/opt/InventiSearch/environments/development/processed_files.json
          export PDF_PATH=/opt/InventiSearch/samplecompany_quotation_pdfs

          docker compose \
            -f /home/deploy/inventisearch/compose.deploy.yaml \
            pull

          docker compose \
            -f /home/deploy/inventisearch/compose.deploy.yaml \
            up -d --remove-orphans

          curl --retry 24 \
               --retry-delay 5 \
               --retry-all-errors \
               --fail \
               --silent \
               --show-error \
               http://127.0.0.1:8001/health

          EOF


  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: deploy-development

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Staging
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          set -e

          export DEPLOY_ENV=staging
          export HOST_PORT=8002
          export IMAGE_TAG=${{ github.sha }}

          export APP_ENV_FILE=/opt/InventiSearch/backend/.env
          export CHROMA_PATH=/opt/InventiSearch/environments/staging/chroma_db
          export PROCESSED_FILE=/opt/InventiSearch/environments/staging/processed_files.json
          export PDF_PATH=/opt/InventiSearch/samplecompany_quotation_pdfs

          docker compose \
            -f /home/deploy/inventisearch/compose.deploy.yaml \
            pull

          docker compose \
            -f /home/deploy/inventisearch/compose.deploy.yaml \
            up -d --remove-orphans

          curl --retry 24 \
               --retry-delay 5 \
               --retry-all-errors \
               --fail \
               --silent \
               --show-error \
               http://127.0.0.1:8002/health

          EOF 