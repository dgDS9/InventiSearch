name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment configuration
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/deploy/inventisearch"

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            compose.deploy.yaml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/deploy/inventisearch/compose.deploy.yaml

      - name: Deploy current Staging image to Production
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            '
            set -e

            STAGING_IMAGE=$(docker inspect --format="{{.Config.Image}}" inventisearch-staging)
            IMAGE_TAG="${STAGING_IMAGE##*:}"

            echo "Promoting Staging image: ${STAGING_IMAGE}"

            export DEPLOY_ENV=production
            export HOST_PORT=8000
            export IMAGE_TAG

            export APP_ENV_FILE=/opt/InventiSearch/backend/.env
            export CHROMA_PATH=/opt/InventiSearch/chroma_db
            export PROCESSED_FILE=/opt/InventiSearch/processed_files.json
            export PDF_PATH=/opt/InventiSearch/samplecompany_quotation_pdfs

            docker compose \
              -f /home/deploy/inventisearch/compose.deploy.yaml \
              pull

            docker compose \
              -f /home/deploy/inventisearch/compose.deploy.yaml \
              up -d --remove-orphans

            curl \
              --retry 24 \
              --retry-delay 5 \
              --retry-all-errors \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/health
            '